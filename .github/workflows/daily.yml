name: Daily plan

on:
  schedule:
    # 12:10 UTC ~ 14:10 Europe/Amsterdam in summer, 13:10 in winter. Scheduled
    # runners are best-effort and can be delayed; acceptable for research, not
    # for anything operational.
    - cron: "10 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "ISO date to plan (default: tomorrow)"
        required: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Fetch and plan
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          kasflex daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Backfill yesterday's realised weather
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        continue-on-error: true
        run: kasflex fetch --date "$(date -d yesterday +%F)"

      # Committing the cache keeps an audit trail of exactly what data each
      # result was computed from, which is the point of the provenance manifest.
      - name: Commit cache and results
        run: |
          git config user.name "kasflex-bot"
          git config user.email "kasflex-bot@users.noreply.github.com"
          git add data/cache results
          git diff --staged --quiet || git commit -m "Daily plan $(date +%F)"
          git push
