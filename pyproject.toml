[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kasflex"
version = "0.1.0"
description = "Verified agentic energy management for greenhouse horticulture under electrical constraints"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agentic-ai", "greenhouse", "horticulture", "energy-management",
            "grid-congestion", "safety-verification", "digital-twin"]
authors = [{ name = "KasFlex contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

# Core is deliberately dependency-light and numpy-major-version agnostic,
# so it can be installed alongside EITHER power-grid-model (numpy>=2)
# OR gl-gym (numpy<2). See docs/DECISIONS.md ADR-0002.
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase-2 grid power flow. Pulls numpy>=2 -- incompatible with gl-gym in the
# same environment. Run GreenLight in the separate worker venv instead.
grid = ["power-grid-model>=1.10", "power-grid-model-ds>=1.5"]
# Dataset acquisition (online, one-off; results are cached to parquet).
data = ["pandas>=2.0", "pyarrow>=15", "entsoe-py>=0.6", "requests>=2.32"]
# Language-model planners. Any subset may be installed.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/youw98/test"
Repository = "https://github.com/youw98/test"
Documentation = "https://github.com/youw98/test/tree/main/docs"

[project.scripts]
kasflex = "kasflex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kasflex"]

# The interface is plain HTML, CSS and JS with no build step, shipped as package
# data so `kasflex ui` works from an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/kasflex/ui/static" = "kasflex/ui/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
